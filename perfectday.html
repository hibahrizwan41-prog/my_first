<!DOCTYPE html>

<html>
<head>
    <title>My Perfect Day</title>

```
<style>
    body {
        font-family: Arial;
        background-color: #f5f1e8;
    }

    .todo {
        width: 500px;
        margin: 50px auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
    }

    h1 {
        text-align: center;
    }

    h2 {
        margin-top: 25px;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        padding: 10px;
        margin: 8px 0;
        background-color: #f2f2f2;
        border-radius: 5px;
    }

    input[type="checkbox"]:checked + label {
        text-decoration: line-through;
        color: gray;
    }
</style>
```

</head>

<body>

```
<div class="todo">

    <h1>My Perfect Day</h1>

    <h2> Morning</h2>

    <ul>
        <li>
            <input type="checkbox" id="task1">
            <label for="task1">Wake up early</label>
        </li>

        <li>
            <input type="checkbox" id="task2">
            <label for="task2">Have a healthy breakfast</label>
        </li>

        <li>
            <input type="checkbox" id="task3">
            <label for="task3">Go for a morning walk</label>
        </li>
    </ul>


    <h2> Afternoon</h2>

    <ul>
        <li>
            <input type="checkbox" id="task4">
            <label for="task4">Complete my work</label>
        </li>

        <li>
            <input type="checkbox" id="task5">
            <label for="task5">Have lunch</label>
        </li>

        <li>
            <input type="checkbox" id="task6">
            <label for="task6">Read a book</label>
        </li>
    </ul>


    <h2> Evening</h2>

    <ul>
        <li>
            <input type="checkbox" id="task7">
            <label for="task7">Exercise</label>
        </li>

        <li>
            <input type="checkbox" id="task8">
            <label for="task8">Spend time with family</label>
        </li>

        <li>
            <input type="checkbox" id="task9">
            <label for="task9">Relax and watch a movie</label>
        </li>
    </ul>

</div>

</body>
</html>
