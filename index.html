<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
            font-size: 14px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background-color: white;
        }

        nav h2 {
            color: #6c4ce4;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 25px;
        }

        nav a:hover {
            color: #6c4ce4;
        }

        /* Hero Section */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            margin-bottom: 30px;
            color: #666;
        }

        .btn {
            padding: 14px 30px;
            background-color: #6c4ce4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #5435c7;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background-color: white;
            color: #777;
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyBrand</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to My Website</h1>

        <p>
            A simple and modern landing page built using
            HTML and CSS.
        </p>

        <a href="#" class="btn">Get Started</a>
    </section>

    <footer>
        © 2026 MyBrand. All rights reserved.
    </footer>

</body>
</html>
